name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # BASE_PATH=/ bakes root-absolute asset paths (e.g. /assets/foo.js) into
      # index.html, which only resolve correctly once this site is served
      # from the root of the sorta.co.jp custom domain. Until the custom
      # domain is configured, the default project-pages URL
      # (https://vickyyyq.github.io/Sortawebsite/) will render blank, because
      # those absolute paths 404 under the /Sortawebsite/ subpath.
      #
      # The CNAME file generated by the build (artifacts/sorta-website/public/CNAME)
      # does NOT configure this automatically — GitHub ignores any CNAME file
      # when a site is published via a custom Actions workflow like this one.
      # The custom domain must instead be set manually in this repo's
      # Settings > Pages > Custom domain field, plus the matching A records
      # (185.199.108.153, .109.153, .110.153, .111.153) at the DNS provider.
      # Once that's done, the github.io URL redirects to sorta.co.jp and
      # this build works without any changes.
      - name: Build sorta-website
        run: pnpm --filter @workspace/sorta-website run build
        env:
          PORT: "4173"
          BASE_PATH: "/"
          NODE_ENV: production

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/sorta-website/dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
